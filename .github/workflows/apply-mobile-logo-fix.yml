name: Apply mobile logo visibility fix

on:
  push:
    branches:
      - fix-mobile-logo-visibility-20260725

permissions:
  contents: write

concurrency:
  group: mobile-logo-visibility-fix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply source fix
        run: node scripts/apply-mobile-logo-fix.mjs

      - name: Install Playwright
        run: npm install --no-package-lock --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full responsive QA
        run: npm run qa

      - name: Verify mobile logo at top and after scroll
        run: node scripts/qa-mobile-logo.mjs

      - name: Upload mobile logo QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detex-mobile-logo-qa
          path: qa-artifacts/mobile-logo-visibility/
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified fix
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-mobile-logo-fix.mjs .github/workflows/apply-mobile-logo-fix.yml
          git add css/styles.css scripts/qa-mobile-logo.mjs .github/workflows/live-deployment-qa.yml
          git commit -m "fix: show mobile logo at top of page"
          git push origin HEAD:fix-mobile-logo-visibility-20260725
